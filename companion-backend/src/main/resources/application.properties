spring.name=companion-backend
server.port=8080

# Disable Spring Boot's default form-login UserDetailsService — this app uses JWT only.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration


# --- Mock end-user identity JWT (Core Journey 1) ---
# LOCAL/DEV ONLY. Overridden by env var in any real deployment. This is
# unrelated to, and must never be merged with, the AI Gateway OAuth2 secret
# below (see MockJwtService javadoc for why these two must stay separate).
companion.jwt.signing-secret=${JWT_SECRET:${MOCK_JWT_SIGNING_SECRET:}}
companion.jwt.issuer=https://companion.candor.local/mock-idp
companion.jwt.audience=candor-life-companion
companion.jwt.expiry-seconds=3600

# --- AI Gateway (Bifrost Proxy — virtual key auth only, no OAuth) ---
# GroundedChatService uses raw HttpClient — no Spring AI beans needed.

logging.level.com.candor.companion=INFO
management.endpoints.web.exposure.include=health

# --- Direct Gateway HTTP client (used by GatewayEmbeddingClient when rag.use-mock=false) ---
# Virtual key is secret — never commit the real value. Inject via env var AI_GATEWAY_VIRTUAL_KEY.
ai.gateway.base-url=https://riskbifrostent.ai/openai
ai.gateway.virtual-key=${AI_GATEWAY_VIRTUAL_KEY:}
ai.gateway.x-git=risk-ai-api

# Gemini fallback (used when AI_GATEWAY_VIRTUAL_KEY is unavailable)
# ai.gemini.api-key=${GEMINI_API_KEY:}

# ── OpenRouter fallback ───────────────────────────────────────────────────────
# Used when AI_GATEWAY_VIRTUAL_KEY is blank. Set model via OPENROUTER_MODEL env var.
ai.openrouter.api-key=${OPENROUTER_API_KEY:}
ai.openrouter.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
ai.openrouter.max-tokens=${OPENROUTER_MAX_TOKENS:1024}

# --- RAG module ---
# In Docker this resolves to /app/data/rag.db; local development keeps its relative default.
rag.db-path=${RAG_DB_PATH:policy_rag.db}

# rag.use-mock=true  → MockEmbeddingClient (no gateway key needed for embeddings)
# rag.use-mock=false → GatewayEmbeddingClient (requires AI_GATEWAY_VIRTUAL_KEY)
# Chat always uses GroundedChatService which auto-selects Bifrost → OpenRouter → Gemini
rag.use-mock=true
rag.embedding-model=bedrock/amazon.titan-embed-text-v2:0
rag.chat-model=bedrock/anthropic.claude-3-haiku-20240307-v1:0
rag.top-k=8
rag.similarity-threshold=0.0
